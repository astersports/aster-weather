name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  check-test:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      # WX-P1-2: dist/ is committed and consumed directly (no consumer build
      # step), so a src-only merge could ship stale compiled bytes to every
      # consumer. Rebuild and fail if the committed dist drifts from src.
      - name: Verify committed dist matches a fresh build
        run: |
          pnpm run build
          if ! git diff --exit-code -- dist/; then
            echo "::error::Committed dist/ is out of date. Run 'pnpm build' and commit dist/."
            exit 1
          fi

  # Supply-chain faucet gate — ported from aster-studio (#67) / the estate kit
  # (aster-io kit/files/scripts/estate/dependency-gate.mjs). Inspects the resolved
  # tree and REPORTS, in the job log and step summary, any major-version bump, any
  # change to a money/child/auth-adjacent package, any watchlisted @aster/* pin,
  # any opaque github pin and any unparseable version change. Per the 2026-10-04
  # owner directive no manual label is requested or read: a classified change
  # passes, and means "review it substantively"; the required `typecheck + test`
  # check and blocking reviews govern the merge. It still FAILS CLOSED when a
  # package.json or lockfile input is missing, unreadable or unparseable.
  #
  # BASE-TRUSTED, as aster-sports runs its gate: the script is taken from the PR's
  # BASE commit, so a PR cannot rewrite the classifier that judges it. A PR that
  # edits the gate is judged by main's copy; the edit takes effect after merge.
  # The script's own tests run in `typecheck + test` (`pnpm run test`) against the
  # PR's copy. PR-only. No install.
  dependency-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Extract the BASE commit's gate (main's code judges the PR, not the PR's own copy)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git rev-parse --verify -q "$BASE_SHA^{commit}" > /dev/null
          mkdir -p "$RUNNER_TEMP/base-gate"
          if git cat-file -e "$BASE_SHA:scripts/dependency-gate.mjs" 2>/dev/null; then
            git show "$BASE_SHA:scripts/dependency-gate.mjs" > "$RUNNER_TEMP/base-gate/dependency-gate.mjs"
            echo "GATE=$RUNNER_TEMP/base-gate/dependency-gate.mjs" >> "$GITHUB_ENV"
          else
            echo "::warning::base $BASE_SHA has no scripts/dependency-gate.mjs — falling back to the PR head's own copy, which this PR could also have edited"
            echo "GATE=scripts/dependency-gate.mjs" >> "$GITHUB_ENV"
          fi
      - name: Resolve base + head package.json + lockfile (P1-A — scan the resolved tree)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          LOCK=pnpm-lock.yaml
          git show "$BASE_SHA:package.json" > /tmp/base-package.json 2>/dev/null || echo '{}' > /tmp/base-package.json
          cp package.json /tmp/head-package.json
          git show "$BASE_SHA:$LOCK" > /tmp/base-lock 2>/dev/null || : > /tmp/base-lock
          cp "$LOCK" /tmp/head-lock 2>/dev/null || : > /tmp/head-lock
      - name: Report major / money-child-auth dependency changes (resolved tree; base's copy of the gate)
        env:
          BASE_PKG: /tmp/base-package.json
          HEAD_PKG: /tmp/head-package.json
          BASE_LOCK: /tmp/base-lock
          HEAD_LOCK: /tmp/head-lock
        run: node "$GATE"
